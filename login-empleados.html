<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceso Empleados · Heliot Media</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <style>
    /* (mismo estilo que antes) */
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-container {
      max-width: 400px;
      width: 100%;
      background: #fff;
      border-radius: 16px;
      padding: 40px 32px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.06);
      border: 1px solid #e6e9ef;
    }
    .login-container .logo { text-align:center; margin-bottom:28px; }
    .login-container .logo img { height:44px; width:auto; }
    .login-container h1 { font-size:24px; font-weight:600; color:#1a2634; text-align:center; margin-bottom:4px; }
    .login-container .sub { text-align:center; color:#5f6b7a; font-size:14px; margin-bottom:28px; }
    .form-group { margin-bottom:18px; }
    .form-group label { display:block; font-size:13px; font-weight:500; color:#1a2634; margin-bottom:4px; }
    .form-group input { width:100%; padding:10px 14px; border:1.5px solid #d1d5db; border-radius:8px; font-size:14px; font-family:'Inter',sans-serif; transition:0.2s; background:#fafbfc; }
    .form-group input:focus { border-color:#066CFF; outline:none; background:#fff; box-shadow:0 0 0 3px rgba(6,108,255,0.1); }
    .btn-primary { width:100%; padding:12px; background:#066CFF; color:#fff; border:none; border-radius:8px; font-size:15px; font-weight:600; cursor:pointer; transition:0.2s; font-family:'Inter',sans-serif; margin-top:6px; }
    .btn-primary:hover { background:#0052cc; }
    .btn-secondary { background:transparent; border:none; color:#066CFF; font-weight:600; cursor:pointer; font-size:14px; padding:6px; font-family:'Inter',sans-serif; }
    .toggle-link { text-align:center; margin-top:16px; font-size:14px; color:#5f6b7a; }
    .toggle-link button { background:none; border:none; color:#066CFF; font-weight:600; cursor:pointer; font-size:14px; font-family:'Inter',sans-serif; }
    .error-msg, .success-msg { padding:10px 14px; border-radius:8px; font-size:13px; margin-bottom:16px; display:none; }
    .error-msg { background:#fee9e7; color:#b91c1c; }
    .success-msg { background:#e6f7e6; color:#0b6e0b; }
    .separator { display:flex; align-items:center; gap:15px; margin:20px 0 18px; color:#8a94a6; font-size:12px; }
    .separator::before, .separator::after { content:''; flex:1; height:1px; background:#e6e9ef; }
    .empleado-code-hint { font-size:12px; color:#8a94a6; margin-top:4px; }
    .role-badge { display:inline-block; background:#e8f0fe; color:#066CFF; font-size:11px; padding:2px 10px; border-radius:12px; margin-top:6px; }
    @media (max-width:480px) { .login-container { padding:30px 20px; } }
  </style>
</head>
<body>
<div class="login-container">
  <div class="logo"><img src="https://blogger.googleusercontent.com/img/a/AVvXsEgjN90ubujO6aF76PMuNTY7el1YR7BDF-CsXglaMEAB_FSzryOks4Zflmnn0fZlXBulUQtp64A5ZJt8IalatFXCNNV2K-qI09uqllYLvcsA_maBOKJ8pggVjMz4OMdG8HZTr2Lyj0dJlThvA37O3PN1IF9BYtaQigzIOVnh9Jovq5FY26YVU_uwK0p0nMuw" alt="Heliot Media"></div>
  <h1>Área de Empleados</h1>
  <p class="sub" id="formSub">Accede para gestionar reservas</p>

  <div id="errorMsg" class="error-msg"></div>
  <div id="successMsg" class="success-msg"></div>

  <!-- Login -->
  <form id="loginForm">
    <div class="form-group"><label>Correo electrónico</label><input type="email" id="loginEmail" placeholder="empleado@heliot.com" required></div>
    <div class="form-group"><label>Contraseña</label><input type="password" id="loginPassword" placeholder="••••••••" required></div>
    <button type="submit" class="btn-primary">Iniciar sesión</button>
  </form>

  <div class="separator">o</div>

  <!-- Registro -->
  <form id="registerForm" style="display:none;">
    <div class="form-group"><label>Correo electrónico</label><input type="email" id="registerEmail" placeholder="empleado@heliot.com" required></div>
    <div class="form-group"><label>Nombre completo</label><input type="text" id="registerName" placeholder="Tu nombre" required></div>
    <div class="form-group"><label>Contraseña (mínimo 6 caracteres)</label><input type="password" id="registerPassword" placeholder="••••••••" required minlength="6"></div>
    <div class="form-group"><label>Código de empleado</label><input type="text" id="registerCode" placeholder="Código secreto" required><div class="empleado-code-hint">Pide el código a tu supervisor.</div></div>
    <button type="submit" class="btn-primary">Registrarse</button>
  </form>

  <div class="toggle-link">
    <span id="toggleText">¿No tienes cuenta? </span>
    <button id="toggleBtn">Regístrate</button>
  </div>
</div>

<script>
  // ===== CONFIGURACIÓN FIREBASE =====
  const firebaseConfig = {
    apiKey: "AIzaSyDpRltXZjEBjlq-4vKDlzL5Fgc5NcKr0_8",
    authDomain: "heliotmediaadmin.firebaseapp.com",
    projectId: "heliotmediaadmin",
    storageBucket: "heliotmediaadmin.firebasestorage.app",
    messagingSenderId: "137792880519",
    appId: "1:137792880519:web:8bf42511db838241eddd22"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();
  const EMPLOYEE_CODE = 'HELIOT2026';

  const loginForm = document.getElementById('loginForm');
  const registerForm = document.getElementById('registerForm');
  const toggleBtn = document.getElementById('toggleBtn');
  const toggleText = document.getElementById('toggleText');
  const errorMsg = document.getElementById('errorMsg');
  const successMsg = document.getElementById('successMsg');
  const formSub = document.getElementById('formSub');
  let isLogin = true;

  function showError(msg) { errorMsg.textContent = msg; errorMsg.style.display = 'block'; successMsg.style.display = 'none'; }
  function showSuccess(msg) { successMsg.textContent = msg; successMsg.style.display = 'block'; errorMsg.style.display = 'none'; }
  function hideMessages() { errorMsg.style.display = 'none'; successMsg.style.display = 'none'; }

  toggleBtn.addEventListener('click', () => {
    isLogin = !isLogin;
    if (isLogin) {
      loginForm.style.display = 'block'; registerForm.style.display = 'none';
      toggleBtn.textContent = 'Regístrate'; toggleText.textContent = '¿No tienes cuenta? ';
      formSub.textContent = 'Accede para gestionar reservas';
    } else {
      loginForm.style.display = 'none'; registerForm.style.display = 'block';
      toggleBtn.textContent = 'Inicia sesión'; toggleText.textContent = '¿Ya tienes cuenta? ';
      formSub.textContent = 'Crea tu cuenta de empleado';
    }
    hideMessages();
  });

  // Login
  loginForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    if (!email || !password) { showError('Completa todos los campos.'); return; }
    auth.signInWithEmailAndPassword(email, password)
      .then(() => { window.location.href = 'panel-empleados.html'; })
      .catch((err) => {
        let msg = 'Error al iniciar sesión. Verifica tus credenciales.';
        if (err.code === 'auth/user-not-found') msg = 'Usuario no encontrado.';
        else if (err.code === 'auth/wrong-password') msg = 'Contraseña incorrecta.';
        else if (err.code === 'auth/invalid-email') msg = 'Correo inválido.';
        else if (err.code === 'auth/too-many-requests') msg = 'Demasiados intentos. Espera un momento.';
        showError(msg);
      });
  });

  // Registro
  registerForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const email = document.getElementById('registerEmail').value.trim();
    const name = document.getElementById('registerName').value.trim();
    const password = document.getElementById('registerPassword').value;
    const code = document.getElementById('registerCode').value.trim();
    if (!email || !name || !password || !code) { showError('Completa todos los campos.'); return; }
    if (code !== EMPLOYEE_CODE) { showError('Código de empleado incorrecto.'); return; }
    if (password.length < 6) { showError('La contraseña debe tener al menos 6 caracteres.'); return; }
    auth.createUserWithEmailAndPassword(email, password)
      .then((userCredential) => {
        const user = userCredential.user;
        return db.collection('users').doc(user.uid).set({
          email: email,
          name: name,
          rol: 'Recepcionista', // rol por defecto
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      })
      .then(() => {
        showSuccess('¡Cuenta creada! Ahora inicia sesión.');
        setTimeout(() => {
          document.getElementById('loginEmail').value = email;
          document.getElementById('loginPassword').value = password;
          isLogin = true;
          loginForm.style.display = 'block'; registerForm.style.display = 'none';
          toggleBtn.textContent = 'Regístrate'; toggleText.textContent = '¿No tienes cuenta? ';
          formSub.textContent = 'Accede para gestionar reservas';
          hideMessages();
        }, 1500);
      })
      .catch((err) => {
        let msg = 'Error al registrar.';
        if (err.code === 'auth/email-already-in-use') msg = 'Este correo ya está registrado.';
        else if (err.code === 'auth/invalid-email') msg = 'Correo inválido.';
        else if (err.code === 'auth/weak-password') msg = 'Contraseña demasiado débil.';
        showError(msg);
      });
  });

  // Redirigir si ya está autenticado
  auth.onAuthStateChanged((user) => {
    if (user) window.location.href = 'panel-empleados.html';
  });
</script>
</body>
</html>
