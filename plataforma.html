<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plataforma Gestión - Firebase + Vercel</title>
    <script src="https://cdn.tailwindcss.com">
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        /* ===== DARK MODE ===== */
        [data-theme="dark"] {
            --bg-primary: #0f0f13;
            --bg-secondary: #1a1a23;
            --bg-card: #22222e;
            --bg-input: #2a2a38;
            --text-primary: #f0f0f5;
            --text-secondary: #b0b0c0;
            --border-color: #3a3a4a;
            --shadow-color: rgba(0, 0, 0, 0.6);
            --hover-bg: #2e2e3e;
            --accent: #6c63ff;
            --accent-hover: #5a52d9;
            --danger: #ff4757;
            --success: #2ed573;
            --warning: #ffa502;
        }

        [data-theme="light"] {
            --bg-primary: #f4f6fb;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --bg-input: #f0f2f5;
            --text-primary: #1a1a2e;
            --text-secondary: #4a4a5e;
            --border-color: #d0d4dd;
            --shadow-color: rgba(0, 0, 0, 0.08);
            --hover-bg: #eef0f5;
            --accent: #6c63ff;
            --accent-hover: #5a52d9;
            --danger: #ff4757;
            --success: #2ed573;
            --warning: #ffa502;
        }

        * {
            transition: background-color 0.25s ease, color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            margin: 0;
        }

        .bg-card {
            background-color: var(--bg-card);
        }
        .bg-secondary {
            background-color: var(--bg-secondary);
        }
        .bg-input {
            background-color: var(--bg-input);
        }
        .text-secondary {
            color: var(--text-secondary);
        }
        .border-custom {
            border-color: var(--border-color);
        }
        .shadow-custom {
            box-shadow: 0 8px 30px var(--shadow-color);
        }
        .hover-bg {
            background-color: var(--hover-bg);
        }
        .text-accent {
            color: var(--accent);
        }
        .bg-accent {
            background-color: var(--accent);
        }
        .bg-accent:hover {
            background-color: var(--accent-hover);
        }
        .btn-danger {
            background-color: var(--danger);
            color: #fff;
        }
        .btn-danger:hover {
            background-color: #e8414f;
        }
        .btn-success {
            background-color: var(--success);
            color: #fff;
        }
        .btn-success:hover {
            background-color: #26c56a;
        }
        .btn-warning {
            background-color: var(--warning);
            color: #fff;
        }
        .btn-warning:hover {
            background-color: #e69400;
        }

        .sidebar-link {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.65rem 1rem;
            border-radius: 0.5rem;
            color: var(--text-secondary);
            text-decoration: none;
            transition: all 0.2s;
            cursor: pointer;
        }
        .sidebar-link:hover {
            background-color: var(--hover-bg);
            color: var(--text-primary);
        }
        .sidebar-link.active {
            background-color: var(--accent);
            color: #fff;
        }

        input,
        select,
        textarea {
            background-color: var(--bg-input);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            padding: 0.6rem 1rem;
            width: 100%;
            outline: none;
            transition: border 0.2s;
        }
        input:focus,
        select:focus,
        textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(108, 99, 255, 0.2);
        }

        .btn {
            padding: 0.6rem 1.5rem;
            border-radius: 0.5rem;
            font-weight: 500;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background-color: var(--accent);
            color: #fff;
        }
        .btn-primary:hover {
            background-color: var(--accent-hover);
            transform: translateY(-1px);
        }

        .btn-outline {
            background-color: transparent;
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }
        .btn-outline:hover {
            background-color: var(--hover-bg);
        }

        .card {
            background-color: var(--bg-card);
            border-radius: 1rem;
            padding: 1.5rem;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 20px var(--shadow-color);
        }

        .badge {
            display: inline-block;
            padding: 0.2rem 0.8rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .badge-active {
            background-color: var(--success);
            color: #fff;
        }
        .badge-suspended {
            background-color: var(--danger);
            color: #fff;
        }
        .badge-admin {
            background-color: var(--accent);
            color: #fff;
        }
        .badge-personal {
            background-color: var(--warning);
            color: #fff;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 1rem;
        }
        .modal-content {
            background-color: var(--bg-card);
            border-radius: 1.5rem;
            padding: 2rem;
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 60px var(--shadow-color);
        }

        .toggle-switch {
            position: relative;
            width: 48px;
            height: 26px;
            background-color: var(--border-color);
            border-radius: 9999px;
            cursor: pointer;
            transition: 0.3s;
            flex-shrink: 0;
        }
        .toggle-switch.active {
            background-color: var(--accent);
        }
        .toggle-switch .thumb {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 20px;
            height: 20px;
            background-color: #fff;
            border-radius: 50%;
            transition: 0.3s;
        }
        .toggle-switch.active .thumb {
            left: 25px;
        }

        /* Scroll */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }

        .fade-in {
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            padding: 1rem 1.5rem;
            border-radius: 1rem;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 40px var(--shadow-color);
            z-index: 9999;
            max-width: 400px;
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .toast-success {
            border-left: 4px solid var(--success);
        }
        .toast-error {
            border-left: 4px solid var(--danger);
        }
        .toast-info {
            border-left: 4px solid var(--accent);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- ===== CDN DEPENDENCIES ===== -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js">
    </script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js">
    </script>
    <script src="https://unpkg.com/react-router-dom@6.20.0/umd/react-router-dom.production.min.js">
    </script>

    <!-- Firebase v9 compat (modular style via compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js">
    </script>

    <!-- ===== APPLICATION CODE ===== -->
    <script type="text/babel">
        const { useState, useEffect, useContext, createContext, useRef, useCallback, useMemo } = React;
        const { BrowserRouter, Routes, Route, Link, useNavigate, useLocation, Navigate } = ReactRouterDOM;

        // ============================================================
        //  1. FIREBASE CONFIG  (¡CAMBIAR CON TUS DATOS!)
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyDemoKey1234567890abcdef", // <-- REEMPLAZAR
            authDomain: "tudominio.firebaseapp.com",
            projectId: "tudominio",
            storageBucket: "tudominio.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef123456"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ============================================================
        //  2. CONTEXTO DE AUTENTICACIÓN
        // ============================================================
        const AuthContext = createContext(null);

        function AuthProvider({ children }) {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [role, setRole] = useState(null);
            const [status, setStatus] = useState(null);

            useEffect(() => {
                const unsub = auth.onAuthStateChanged(async (u) => {
                    setLoading(true);
                    if (u) {
                        setUser(u);
                        // Obtener rol y estado desde Firestore
                        try {
                            const doc = await db.collection('empleados').doc(u.uid).get();
                            if (doc.exists) {
                                const data = doc.data();
                                setRole(data.rol || 'personal');
                                setStatus(data.estado || 'activo');
                            } else {
                                // Si no existe en empleados, crear como personal por defecto
                                await db.collection('empleados').doc(u.uid).set({
                                    uid: u.uid,
                                    email: u.email,
                                    nombre: u.displayName || u.email?.split('@')[0] || 'Usuario',
                                    rol: 'personal',
                                    estado: 'activo',
                                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                                });
                                setRole('personal');
                                setStatus('activo');
                            }
                        } catch (e) {
                            console.warn('Error obteniendo rol:', e);
                            setRole('personal');
                            setStatus('activo');
                        }
                    } else {
                        setUser(null);
                        setRole(null);
                        setStatus(null);
                    }
                    setLoading(false);
                });
                return () => unsub();
            }, []);

            const value = { user, loading, role, status, setRole, setStatus };
            return <AuthContext.Provider value={value}>{children}</AuthContext.Provider>;
        }

        function useAuth() {
            return useContext(AuthContext);
        }

        // ============================================================
        //  3. TOAST NOTIFICATIONS
        // ============================================================
        function Toast({ message, type, onClose }) {
            useEffect(() => {
                const timer = setTimeout(onClose, 4000);
                return () => clearTimeout(timer);
            }, [onClose]);
            const icons = {
                success: 'fa-check-circle',
                error: 'fa-exclamation-circle',
                info: 'fa-info-circle'
            };
            return (
                <div className={`toast toast-${type} flex items-center gap-3`}>
                    <i className={`fas ${icons[type] || icons.info} text-${type === 'success' ? 'green' : type === 'error' ? 'red' : 'accent'}-500`}></i>
                    <span>{message}</span>
                    <button onClick={onClose} className="ml-auto text-secondary hover:text-primary">
                        <i className="fas fa-times"></i>
                    </button>
                </div>
            );
        }

        // ============================================================
        //  4. TEMA OSCURO/CLARO
        // ============================================================
        function useTheme() {
            const [theme, setTheme] = useState(() => localStorage.getItem('theme') || 'light');
            useEffect(() => {
                document.documentElement.setAttribute('data-theme', theme);
                localStorage.setItem('theme', theme);
            }, [theme]);
            return { theme, toggle: () => setTheme(t => t === 'light' ? 'dark' : 'light') };
        }

        // ============================================================
        //  5. COMPONENTES PRINCIPALES
        // ============================================================

        // ---- 5a. Login ----
        function Login() {
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [isRegister, setIsRegister] = useState(false);
            const [error, setError] = useState('');
            const [loading, setLoading] = useState(false);
            const navigate = useNavigate();
            const { user, role, status } = useAuth();

            useEffect(() => {
                if (user && status === 'activo') {
                    navigate('/dashboard');
                } else if (user && status === 'suspendido') {
                    setError('Tu cuenta ha sido suspendida. Contacta al administrador.');
                    auth.signOut();
                }
            }, [user, status, navigate]);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setError('');
                setLoading(true);
                try {
                    if (isRegister) {
                        const cred = await auth.createUserWithEmailAndPassword(email, password);
                        // Crear perfil en Firestore
                        await db.collection('empleados').doc(cred.user.uid).set({
                            uid: cred.user.uid,
                            email: email,
                            nombre: email.split('@')[0] || 'Usuario',
                            rol: 'personal',
                            estado: 'activo',
                            createdAt: firebase.firestore.FieldValue.serverTimestamp()
                        });
                        // Enviar correo de verificación (opcional)
                        // await cred.user.sendEmailVerification();
                    } else {
                        await auth.signInWithEmailAndPassword(email, password);
                    }
                    navigate('/dashboard');
                } catch (err) {
                    setError(err.message);
                }
                setLoading(false);
            };

            return (
                <div className="min-h-screen flex items-center justify-center p-4" style={{ backgroundColor: 'var(--bg-primary)' }}>
                    <div className="card w-full max-w-md fade-in">
                        <div className="text-center mb-6">
                            <div className="w-16 h-16 bg-accent rounded-2xl flex items-center justify-center mx-auto mb-3">
                                <i className="fas fa-calendar-check text-white text-2xl"></i>
                            </div>
                            <h2 className="text-2xl font-bold">{isRegister ? 'Crear cuenta' : 'Iniciar sesión'}</h2>
                            <p className="text-secondary text-sm mt-1">Gestiona tu negocio en tiempo real</p>
                        </div>
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="block text-sm font-medium mb-1">Correo electrónico</label>
                                <input type="email" value={email} onChange={e => setEmail(e.target.value)} required
                                placeholder="ejemplo@correo.com" />
                            </div>
                            <div>
                                <label className="block text-sm font-medium mb-1">Contraseña</label>
                                <input type="password" value={password} onChange={e => setPassword(e.target.value)} required
                                placeholder="••••••••" minLength="6" />
                            </div>
                            {error && <div className="text-red-500 text-sm bg-red-50 dark:bg-red-900/20 p-2 rounded">{error}</div>}
                            <button type="submit" className="btn btn-primary w-full justify-center" disabled={loading}>
                                {loading ? <i className="fas fa-spinner fa-spin"></i> : null}
                                {isRegister ? 'Registrarse' : 'Iniciar sesión'}
                            </button>
                        </form>
                        <div className="mt-4 text-center text-sm">
                            <button onClick={() => setIsRegister(!isRegister)} className="text-accent hover:underline">
                                {isRegister ? '¿Ya tienes cuenta? Inicia sesión' : '¿No tienes cuenta? Regístrate'}
                            </button>
                        </div>
                        <div className="mt-4 text-center text-xs text-secondary">
                            <i className="fas fa-shield-alt mr-1"></i> Autenticación segura con Firebase
                        </div>
                    </div>
                </div>
            );
        }

        // ---- 5b. Protected Route ----
        function ProtectedRoute({ children, allowedRoles, requireActive = true }) {
            const { user, loading, role, status } = useAuth();
            const navigate = useNavigate();

            useEffect(() => {
                if (!loading) {
                    if (!user) {
                        navigate('/login');
                    } else if (requireActive && status !== 'activo') {
                        auth.signOut();
                        navigate('/login');
                    } else if (allowedRoles && !allowedRoles.includes(role)) {
                        navigate('/dashboard');
                    }
                }
            }, [user, loading, role, status, navigate, allowedRoles, requireActive]);

            if (loading || !user) return (
                <div className="min-h-screen flex items-center justify-center" style={{ backgroundColor: 'var(--bg-primary)' }}>
                    <i className="fas fa-spinner fa-spin text-3xl text-accent"></i>
                </div>
            );
            if (requireActive && status !== 'activo') return null;
            if (allowedRoles && !allowedRoles.includes(role)) return null;
            return children;
        }

        // ---- 5c. Sidebar / Navigation ----
        function Sidebar({ children }) {
            const { user, role } = useAuth();
            const location = useLocation();
            const { theme, toggle } = useTheme();
            const navigate = useNavigate();

            const links = [
                { to: '/dashboard', icon: 'fa-gauge-high', label: 'Dashboard', show: true },
                { to: '/clientes', icon: 'fa-users', label: 'Clientes', show: true },
                { to: '/reservas', icon: 'fa-calendar-plus', label: 'Reservas', show: true },
                { to: '/pagos', icon: 'fa-credit-card', label: 'Pagos', show: true },
                { to: '/empleados', icon: 'fa-user-tie', label: 'Empleados', show: role === 'admin' },
                { to: '/perfil', icon: 'fa-user-cog', label: 'Mi Perfil', show: true },
            ];

            const handleLogout = async () => {
                await auth.signOut();
                navigate('/login');
            };

            return (
                <div className="flex min-h-screen" style={{ backgroundColor: 'var(--bg-primary)' }}>
                    {/* Sidebar */}
                    <aside className="w-64 flex-shrink-0 p-4 hidden md:block" style={{ backgroundColor: 'var(--bg-secondary)', borderRight: '1px solid var(--border-color)' }}>
                        <div className="flex items-center gap-3 mb-8 px-2">
                            <div className="w-10 h-10 bg-accent rounded-xl flex items-center justify-center">
                                <i className="fas fa-calendar-check text-white"></i>
                            </div>
                            <span className="font-bold text-lg">Gestión</span>
                        </div>
                        <nav className="space-y-1">
                            {links.map(l => l.show && (
                                <Link key={l.to} to={l.to} className={`sidebar-link ${location.pathname === l.to ? 'active' : ''}`}>
                                    <i className={`fas ${l.icon} w-5 text-center`}></i>
                                    {l.label}
                                </Link>
                            ))}
                        </nav>
                        <div className="absolute bottom-4 left-4 right-4 space-y-2">
                            <button onClick={toggle} className="sidebar-link w-full">
                                <i className={`fas ${theme === 'light' ? 'fa-moon' : 'fa-sun'}`}></i>
                                {theme === 'light' ? 'Modo oscuro' : 'Modo claro'}
                            </button>
                            <button onClick={handleLogout} className="sidebar-link w-full text-red-500 hover:bg-red-50 dark:hover:bg-red-900/20">
                                <i className="fas fa-sign-out-alt w-5 text-center"></i>
                                Cerrar sesión
                            </button>
                            <div className="px-3 pt-2 text-xs text-secondary truncate">
                                <i className="fas fa-user mr-1"></i> {user?.email}
                                <span className={`badge ml-2 ${role === 'admin' ? 'badge-admin' : 'badge-personal'}`}>
                                    {role || 'personal'}
                                </span>
                            </div>
                        </div>
                    </aside>

                    {/* Mobile header */}
                    <div className="flex-1">
                        <header className="md:hidden p-4 flex items-center justify-between" style={{ backgroundColor: 'var(--bg-secondary)', borderBottom: '1px solid var(--border-color)' }}>
                            <div className="flex items-center gap-2">
                                <div className="w-8 h-8 bg-accent rounded-lg flex items-center justify-center">
                                    <i className="fas fa-calendar-check text-white text-sm"></i>
                                </div>
                                <span className="font-bold">Gestión</span>
                            </div>
                            <div className="flex items-center gap-3">
                                <button onClick={toggle}>
                                    <i className={`fas ${theme === 'light' ? 'fa-moon' : 'fa-sun'}`}></i>
                                </button>
                                <button onClick={handleLogout} className="text-red-500">
                                    <i className="fas fa-sign-out-alt"></i>
                                </button>
                            </div>
                        </header>
                        <main className="p-4 md:p-6">
                            {children}
                        </main>
                    </div>
                </div>
            );
        }

        // ---- 5d. Dashboard ----
        function Dashboard() {
            const { user, role } = useAuth();
            const [stats, setStats] = useState({ clientes: 0, reservas: 0, pagos: 0, empleados: 0 });

            useEffect(() => {
                const unsubs = [];
                const collections = ['clientes', 'reservas', 'pagos', 'empleados'];
                collections.forEach(name => {
                    const unsub = db.collection(name).onSnapshot(snap => {
                        setStats(prev => ({ ...prev, [name]: snap.size }));
                    }, err => console.warn('Error en', name, err));
                    unsubs.push(unsub);
                });
                return () => unsubs.forEach(u => u());
            }, []);

            const cards = [
                { label: 'Clientes', value: stats.clientes, icon: 'fa-users', color: 'text-blue-500' },
                { label: 'Reservas', value: stats.reservas, icon: 'fa-calendar-plus', color: 'text-green-500' },
                { label: 'Pagos', value: stats.pagos, icon: 'fa-credit-card', color: 'text-purple-500' },
                { label: 'Empleados', value: stats.empleados, icon: 'fa-user-tie', color: 'text-orange-500' },
            ];

            const today = new Date().toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });

            return (
                <div className="fade-in">
                    <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between mb-6">
                        <div>
                            <h1 className="text-2xl font-bold">Dashboard</h1>
                            <p className="text-secondary text-sm">Bienvenido, {user?.displayName || user?.email}</p>
                        </div>
                        <div className="text-sm text-secondary mt-2 sm:mt-0">
                            <i className="far fa-calendar mr-1"></i> {today}
                        </div>
                    </div>
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                        {cards.map((c, i) => (
                            <div key={i} className="card flex items-center gap-4">
                                <div className={`w-12 h-12 rounded-xl flex items-center justify-center text-2xl ${c.color} bg-opacity-10`} style={{ backgroundColor: 'var(--hover-bg)' }}>

        // ---- 5e. CRUD genérico ----
        function useCollection(collectionName) {
            const [items, setItems] = useState([]);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                const unsub = db.collection(collectionName).orderBy('createdAt', 'desc').onSnapshot(snap => {
                    const data = [];
                    snap.forEach(doc => data.push({ id: doc.id, ...doc.data() }));
                    setItems(data);
                    setLoading(false);
                }, err => {
                    console.warn('Error en', collectionName, err);
                    setLoading(false);
                });
                return () => unsub();
            }, [collectionName]);

            const add = async (data) => {
                await db.collection(collectionName).add({
                    ...data,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
            };

            const update = async (id, data) => {
                await db.collection(collectionName).doc(id).update(data);
            };

            const remove = async (id) => {
                await db.collection(collectionName).doc(id).delete();
            };

            return { items, loading, add, update, remove };
        }

                                </div>
                            ))}
                            {items.length === 0 && (
                                <div className="col-span-full text-center text-secondary py-8">
                                    <i className="fas fa-user-tie text-4xl mb-2 opacity-30"></i>
                                    <p>No hay empleados registrados</p>
                                </div>
                            )}
                        </div>
                    )}
                    {showModal && (
                        <Modal title={editing ? 'Editar empleado' : 'Invitar empleado'} onClose={() => setShowModal(false)}>
                            <form onSubmit={handleSubmit} className="space-y-3">
                                <div>
                                    <label className="block text-sm font-medium mb-1">Nombre *</label>
                                    <input type="text" value={form.nombre} onChange={e => setForm({ ...form, nombre: e.target.value })} required />
                                </div>
                                {!editing && (
                                    <div>
                                        <label className="block text-sm font-medium mb-1">Email *</label>
                                        <input type="email" value={form.email} onChange={e => setForm({ ...form, email: e.target.value })} required />
                                        <p className="text-xs text-secondary mt-1">Se enviará un correo con la contraseña temporal.</p>
                                    </div>
                                )}
                                <div>
                                    <label className="block text-sm font-medium mb-1">Rol</label>
                                    <select value={form.rol} onChange={e => setForm({ ...form, rol: e.target.value })}>
                                        <option value="personal">Personal</option>
                                        <option value="admin">Administrador</option>
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-sm font-medium mb-1">Estado</label>
                                    <select value={form.estado} onChange={e => setForm({ ...form, estado: e.target.value })}>
                                        <option value="activo">Activo</option>
                                        <option value="suspendido">Suspendido</option>
                                    </select>
                                </div>
                                <div className="flex gap-2 pt-2">
                                    <button type="submit" className="btn btn-primary flex-1">{editing ? 'Actualizar' : 'Invitar'}</button>
                                    <button type="button" className="btn btn-outline" onClick={() => setShowModal(false)}>Cancelar</button>
                                </div>
                            </form>
                        </Modal>
                    )}
                    {toast && <Toast {...toast} onClose={() => setToast(null)} />}
                </div>
            );
        }

        // ---- 5j. Perfil ----
        function Perfil() {
            const { user } = useAuth();
            const [nombre, setNombre] = useState('');
            const [password, setPassword] = useState('');
            const [passwordConfirm, setPasswordConfirm] = useState('');
            const [loading, setLoading] = useState(false);
            const [toast, setToast] = useState(null);
            const [userData, setUserData] = useState(null);

            useEffect(() => {
                if (user) {
                    db.collection('empleados').doc(user.uid).get().then(doc => {
                        if (doc.exists) {
                            const data = doc.data();
                            setUserData(data);
                            setNombre(data.nombre || '');
                        }
                    }).catch(() => {});
                }
            }, [user]);

            const handleUpdateProfile = async (e) => {
                e.preventDefault();
                setLoading(true);
                try {
                    if (nombre && nombre !== userData?.nombre) {
                        await db.collection('empleados').doc(user.uid).update({ nombre });
                        await user.updateProfile({ displayName: nombre });
                        setToast({ message: 'Nombre actualizado', type: 'success' });
                    }
                    if (password) {
                        if (password.length < 6) {
                            setToast({ message: 'La contraseña debe tener al menos 6 caracteres', type: 'error' });
                            setLoading(false);
                            return;
                        }
                        if (password !== passwordConfirm) {
                            setToast({ message: 'Las contraseñas no coinciden', type: 'error' });
                            setLoading(false);
                            return;
                        }
                        await user.updatePassword(password);
                        setToast({ message: 'Contraseña actualizada', type: 'success' });
                        setPassword('');
                        setPasswordConfirm('');
                    }
                } catch (err) {
                    setToast({ message: err.message, type: 'error' });
                }
                setLoading(false);
            };

            return (
                <div className="fade-in max-w-2xl mx-auto">
                    <h1 className="text-2xl font-bold mb-4">Mi Perfil</h1>
                    <div className="card space-y-4">
                        <div className="flex items-center gap-4 pb-4 border-b border-custom">
                            <div className="w-16 h-16 bg-accent rounded-full flex items-center justify-center text-white text-2xl font-bold">
                                {userData?.nombre?.[0] || user?.email?.[0] || 'U'}
                            </div>
                            <div>
                                <p className="font-semibold">{userData?.nombre || 'Usuario'}</p>
                                <p className="text-sm text-secondary">{user?.email}</p>
                                <span className={`badge ${userData?.rol === 'admin' ? 'badge-admin' : 'badge-personal'}`}>
                                    {userData?.rol || 'personal'}
                                </span>
                            </div>
                        </div>
                        <form onSubmit={handleUpdateProfile} className="space-y-3">
                            <div>
                                <label className="block text-sm font-medium mb-1">Nombre</label>
                                <input type="text" value={nombre} onChange={e => setNombre(e.target.value)} placeholder="Tu nombre" />
                            </div>
                            <div>
                                <label className="block text-sm font-medium mb-1">Correo (no editable)</label>
                                <input type="email" value={user?.email || ''} disabled className="opacity-60 cursor-not-allowed" />
                            </div>
                            <div className="border-t border-custom pt-3 mt-2">
                                <p className="text-sm font-medium mb-2">Cambiar contraseña</p>
                                <div className="space-y-2">
                                    <input type="password" value={password} onChange={e => setPassword(e.target.value)} placeholder="Nueva contraseña (mínimo 6 caracteres)" />
                                    <input type="password" value={passwordConfirm} onChange={e => setPasswordConfirm(e.target.value)} placeholder="Confirmar nueva contraseña" />
                                </div>
                            </div>
                            <button type="submit" className="btn btn-primary" disabled={loading}>
                                {loading ? <i className="fas fa-spinner fa-spin"></i> : null}
                                Guardar cambios
                            </button>
                        </form>
                    </div>
                    {toast && <Toast {...toast} onClose={() => setToast(null)} />}
                </div>
            );
        }

        // ---- 5k. Modal ----
        function Modal({ title, onClose, children }) {
            return (
                <div className="modal-overlay" onClick={onClose}>
                    <div className="modal-content" onClick={e => e.stopPropagation()}>
                        <div className="flex justify-between items-center mb-4">
                            <h2 className="text-xl font-bold">{title}</h2>
                            <button onClick={onClose} className="text-secondary hover:text-primary">
                                <i className="fas fa-times"></i>
                            </button>
                        </div>
                        {children}
                    </div>
                </div>
            );
        }

        // ============================================================
        //  6. APP PRINCIPAL
        // ============================================================
        function App() {
            const { user, loading } = useAuth();

            if (loading) {
                return (
                    <div className="min-h-screen flex items-center justify-center" style={{ backgroundColor: 'var(--bg-primary)' }}>
                        <i className="fas fa-spinner fa-spin text-3xl text-accent"></i>
                    </div>
                );
            }

            return (
                <BrowserRouter>
                    <Routes>
                        <Route path="/login" element={<Login />} />
                        <Route path="/" element={<Navigate to={user ? '/dashboard' : '/login'} />} />

                        <Route path="/dashboard" element={
                            <ProtectedRoute requireActive>
                                <Sidebar><Dashboard /></Sidebar>
                            </ProtectedRoute>
                        } />
                        <Route path="/clientes" element={
                            <ProtectedRoute requireActive>
                                <Sidebar><Clientes /></Sidebar>
                            </ProtectedRoute>
                        } />
                        <Route path="/reservas" element={
                            <ProtectedRoute requireActive>
                                <Sidebar><Reservas /></Sidebar>
                            </ProtectedRoute>
                        } />
                        <Route path="/pagos" element={
                            <ProtectedRoute requireActive>
                                <Sidebar><Pagos /></Sidebar>
                            </ProtectedRoute>
                        } />
                        <Route path="/empleados" element={
                            <ProtectedRoute requireActive allowedRoles={['admin']}>
                                <Sidebar><Empleados /></Sidebar>
                            </ProtectedRoute>
                        } />
                        <Route path="/perfil" element={
                            <ProtectedRoute requireActive>
                                <Sidebar><Perfil /></Sidebar>
                            </ProtectedRoute>
                        } />
                        <Route path="*" element={<Navigate to="/dashboard" />} />
                    </Routes>
                </BrowserRouter>
            );
        }

        // ============================================================
        //  7. RENDER
        // ============================================================
        ReactDOM.createRoot(document.getElementById('root')).render(
            <AuthProvider>
                <App />
            </AuthProvider>
        );
    </script>
</body>
</html>
