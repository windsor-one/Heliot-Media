<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Heliot Panel · Empleados</title>
  <!-- Google Fonts -->
  <link href='https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap' rel='stylesheet'/>
  <!-- Font Awesome 6 (gratis) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <style>
    /* ============================================
       RESET Y VARIABLES GLOBALES (DISEÑO PREMIUM)
       ============================================ */
    :root {
      --primary: #0a1e3c;
      --primary-light: #1a3a6a;
      --secondary: #F5B041;
      --secondary-light: #fdebd0;
      --bg-body: #f0f2f8;
      --white: #ffffff;
      --text-dark: #0f1a2e;
      --text-muted: #6b7a8f;
      --border-light: #e6eaf2;
      --shadow-card: 0 8px 30px rgba(10, 30, 60, 0.08);
      --shadow-hover: 0 12px 40px rgba(10, 30, 60, 0.15);
      --radius-card: 20px;
      --radius-btn: 12px;
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font);
      background: var(--bg-body);
      color: var(--text-dark);
      min-height: 100vh;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    .app-container {
      max-width: 1440px;
      margin: 0 auto;
    }

    /* ============================================
       HEADER PREMIUM
       ============================================ */
    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
      margin-bottom: 32px;
      padding: 18px 28px;
      background: var(--white);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
      border: 1px solid var(--border-light);
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .header-left .logo-icon {
      width: 44px;
      height: 44px;
      background: var(--primary);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--secondary);
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
      box-shadow: 0 4px 12px rgba(10, 30, 60, 0.2);
    }
    .header-left h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--primary);
    }
    .header-left h1 span {
      color: var(--secondary);
    }
    .header-left .subtitle {
      font-size: 13px;
      font-weight: 400;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 18px;
    }
    .user-badge {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg-body);
      padding: 6px 16px 6px 12px;
      border-radius: 50px;
      border: 1px solid var(--border-light);
    }
    .user-badge .avatar {
      width: 34px;
      height: 34px;
      background: var(--primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-size: 15px;
    }
    .user-badge .user-name {
      font-weight: 600;
      font-size: 14px;
      color: var(--text-dark);
    }
    .btn-logout-premium {
      background: transparent;
      border: 1px solid var(--border-light);
      color: var(--text-muted);
      padding: 8px 18px;
      border-radius: 50px;
      font-weight: 500;
      font-size: 13px;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-logout-premium:hover {
      background: #fee2e2;
      border-color: #fca5a5;
      color: #b91c1c;
    }

    /* ============================================
       TARJETAS DE ESTADÍSTICAS
       ============================================ */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }
    .stat-card-premium {
      background: var(--white);
      padding: 22px 24px;
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
      border: 1px solid var(--border-light);
      transition: var(--transition);
      position: relative;
      overflow: hidden;
    }
    .stat-card-premium::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background: var(--secondary);
      border-radius: 0 4px 4px 0;
    }
    .stat-card-premium:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-hover);
    }
    .stat-card-premium .stat-number {
      font-size: 32px;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: -0.5px;
      line-height: 1.1;
    }
    .stat-card-premium .stat-label {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .stat-card-premium .stat-icon {
      color: var(--secondary);
      font-size: 20px;
      opacity: 0.6;
    }

    /* ============================================
       BARRA DE ACCIONES
       ============================================ */
    .actions-bar-premium {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-bottom: 28px;
      align-items: center;
    }
    .btn-primary-premium {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px 28px;
      border-radius: var(--radius-btn);
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 14px rgba(10, 30, 60, 0.15);
    }
    .btn-primary-premium:hover {
      background: var(--primary-light);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(10, 30, 60, 0.25);
    }
    .btn-secondary-premium {
      background: var(--secondary-light);
      color: var(--primary);
      border: 1px solid #f5cba7;
      padding: 12px 24px;
      border-radius: var(--radius-btn);
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn-secondary-premium:hover {
      background: #fdebd0;
      transform: translateY(-2px);
    }

    /* ============================================
       TABLA PREMIUM
       ============================================ */
    .table-wrapper-premium {
      background: var(--white);
      border-radius: var(--radius-card);
      padding: 24px 24px 20px;
      box-shadow: var(--shadow-card);
      border: 1px solid var(--border-light);
      overflow-x: auto;
    }
    .table-header-premium {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .table-header-premium h3 {
      font-size: 18px;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: -0.3px;
    }
    .table-header-premium .badge-count {
      background: var(--bg-body);
      padding: 4px 14px;
      border-radius: 50px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    thead {
      background: var(--bg-body);
      border-radius: 12px;
    }
    thead th {
      text-align: left;
      padding: 14px 16px;
      font-weight: 600;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: var(--text-muted);
      border-bottom: 2px solid var(--border-light);
    }
    tbody td {
      padding: 16px 16px;
      border-bottom: 1px solid var(--border-light);
      vertical-align: middle;
      color: var(--text-dark);
    }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: #fafbfd; }

    .cliente-cell {
      font-weight: 600;
      color: var(--primary);
    }
    .cliente-cell small {
      display: block;
      font-weight: 400;
      color: var(--text-muted);
      font-size: 12px;
      margin-top: 2px;
    }

    .badge-status-premium {
      display: inline-block;
      padding: 4px 16px;
      border-radius: 50px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }
    .badge-status-premium.pendiente { background: #fef3c7; color: #92400e; }
    .badge-status-premium.confirmada { background: #d1fae5; color: #065f46; }
    .badge-status-premium.cancelada { background: #fee2e2; color: #991b1b; }

    .actions-cell-premium {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .btn-icon-edit {
      background: transparent;
      border: 1px solid var(--border-light);
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 30px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-icon-edit:hover {
      background: #dbeafe;
      border-color: #93c5fd;
      color: #1e40af;
    }
    .btn-icon-delete {
      background: transparent;
      border: 1px solid var(--border-light);
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 30px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-icon-delete:hover {
      background: #fee2e2;
      border-color: #fca5a5;
      color: #b91c1c;
    }

    /* ============================================
       MODAL PREMIUM
       ============================================ */
    .modal-overlay-premium {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 30, 60, 0.6);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 20px;
    }
    .modal-overlay-premium.active { display: flex; }
    .modal-premium {
      background: var(--white);
      max-width: 540px;
      width: 100%;
      border-radius: 28px;
      padding: 36px 32px;
      box-shadow: 0 40px 80px rgba(10, 30, 60, 0.3);
      animation: slideUpPremium 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes slideUpPremium {
      from { transform: translateY(40px) scale(0.96); opacity: 0; }
      to { transform: translateY(0) scale(1); opacity: 1; }
    }
    .modal-premium .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .modal-premium .modal-head h2 {
      font-size: 24px;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: -0.5px;
    }
    .modal-premium .modal-close-btn {
      background: none;
      border: none;
      font-size: 28px;
      color: var(--text-muted);
      cursor: pointer;
      transition: var(--transition);
      line-height: 1;
    }
    .modal-premium .modal-close-btn:hover { color: var(--primary); transform: rotate(90deg); }
    .modal-premium .form-group {
      margin-bottom: 18px;
    }
    .modal-premium .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-dark);
      margin-bottom: 5px;
    }
    .modal-premium .form-group input,
    .modal-premium .form-group select,
    .modal-premium .form-group textarea {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid var(--border-light);
      border-radius: 12px;
      font-family: var(--font);
      font-size: 14px;
      background: #fafbfd;
      transition: var(--transition);
      color: var(--text-dark);
    }
    .modal-premium .form-group input:focus,
    .modal-premium .form-group select:focus,
    .modal-premium .form-group textarea:focus {
      border-color: var(--primary);
      outline: none;
      background: var(--white);
      box-shadow: 0 0 0 4px rgba(10, 30, 60, 0.06);
    }
    .modal-premium .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .modal-premium .modal-actions {
      display: flex;
      gap: 14px;
      justify-content: flex-end;
      margin-top: 24px;
    }
    .modal-premium .btn-cancel-premium {
      background: transparent;
      border: 1px solid var(--border-light);
      color: var(--text-muted);
      padding: 12px 28px;
      border-radius: var(--radius-btn);
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: var(--transition);
    }
    .modal-premium .btn-cancel-premium:hover {
      background: var(--bg-body);
    }
    .modal-premium .btn-submit-premium {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px 32px;
      border-radius: var(--radius-btn);
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: var(--transition);
      box-shadow: 0 4px 14px rgba(10, 30, 60, 0.15);
    }
    .modal-premium .btn-submit-premium:hover {
      background: var(--primary-light);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(10, 30, 60, 0.25);
    }

    /* ============================================
       RESPONSIVE
       ============================================ */
    @media (max-width: 768px) {
      .dashboard-header { flex-direction: column; align-items: stretch; text-align: center; }
      .header-left { flex-direction: column; align-items: center; }
      .header-right { justify-content: center; flex-wrap: wrap; }
      .stats-grid { grid-template-columns: 1fr 1fr; }
      .modal-premium .form-row { grid-template-columns: 1fr; }
      .modal-premium { padding: 28px 20px; }
      table { font-size: 13px; }
      th, td { padding: 10px 10px; }
      .actions-cell-premium { flex-direction: column; align-items: flex-start; }
    }
    @media (max-width: 480px) {
      .stats-grid { grid-template-columns: 1fr; }
      .header-left h1 { font-size: 18px; }
    }

    /* ============================================
       UTILIDADES
       ============================================ */
    .text-muted { color: var(--text-muted); }
    .mt-1 { margin-top: 8px; }
    .mb-1 { margin-bottom: 8px; }
    .flex { display: flex; align-items: center; gap: 6px; }
  </style>
</head>
<body>

<div class="app-container">

  <!-- ========== HEADER PREMIUM ========== -->
  <header class="dashboard-header">
    <div class="header-left">
      <div class="logo-icon">H</div>
      <div>
        <h1>Heliot <span>Panel</span></h1>
        <div class="subtitle">Gestión interna · Empleados</div>
      </div>
    </div>
    <div class="header-right">
      <div class="user-badge">
        <div class="avatar" id="userAvatar">E</div>
        <span class="user-name" id="userName">Empleado</span>
      </div>
      <button class="btn-logout-premium" id="logoutBtn">
        <i class="fas fa-sign-out-alt"></i> Salir
      </button>
    </div>
  </header>

  <!-- ========== ESTADÍSTICAS ========== -->
  <section class="stats-grid">
    <div class="stat-card-premium">
      <div class="stat-number" id="totalReservas">0</div>
      <div class="stat-label"><i class="fas fa-calendar-check stat-icon"></i> Total reservas</div>
    </div>
    <div class="stat-card-premium">
      <div class="stat-number" id="reservasHoy">0</div>
      <div class="stat-label"><i class="fas fa-calendar-day stat-icon"></i> Reservas de hoy</div>
    </div>
    <div class="stat-card-premium">
      <div class="stat-number" id="reservasPendientes">0</div>
      <div class="stat-label"><i class="fas fa-clock stat-icon"></i> Pendientes</div>
    </div>
    <div class="stat-card-premium">
      <div class="stat-number" id="reservasConfirmadas">0</div>
      <div class="stat-label"><i class="fas fa-check-circle stat-icon"></i> Confirmadas</div>
    </div>
  </section>

  <!-- ========== ACCIONES ========== -->
  <div class="actions-bar-premium">
    <button class="btn-primary-premium" id="btnNuevaReserva">
      <i class="fas fa-plus-circle"></i> Nueva reserva
    </button>
    <button class="btn-secondary-premium" id="btnLimpiarFiltros">
      <i class="fas fa-sync-alt"></i> Mostrar todas
    </button>
  </div>

  <!-- ========== TABLA ========== -->
  <div class="table-wrapper-premium">
    <div class="table-header-premium">
      <h3><i class="fas fa-list-ul" style="color:var(--secondary);margin-right:8px;"></i> Reservas activas</h3>
      <span class="badge-count" id="reservasCount">0 registros</span>
    </div>
    <table>
      <thead>
        <tr>
          <th>Cliente</th>
          <th>Teléfono</th>
          <th>Fecha</th>
          <th>Hora</th>
          <th>Paquete</th>
          <th>Estado</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="reservasBody">
        <tr>
          <td colspan="7" style="text-align:center; color:var(--text-muted); padding:40px 0;">
            <i class="fas fa-spinner fa-spin" style="font-size:20px;"></i> Cargando reservas...
          </td>
        </tr>
      </tbody>
    </table>
  </div>

</div>

<!-- ========== MODAL PREMIUM ========== -->
<div class="modal-overlay-premium" id="modalReserva">
  <div class="modal-premium">
    <div class="modal-head">
      <h2 id="modalTitle">Nueva Reserva</h2>
      <button class="modal-close-btn" id="modalCloseBtn">&times;</button>
    </div>
    <form id="reservaForm">
      <input type="hidden" id="reservaId">

      <div class="form-group">
        <label><i class="fas fa-user" style="color:var(--secondary);margin-right:6px;"></i> Nombre del cliente *</label>
        <input type="text" id="clienteNombre" placeholder="Ej: María González" required>
      </div>
      <div class="form-group">
        <label><i class="fas fa-phone" style="color:var(--secondary);margin-right:6px;"></i> Teléfono *</label>
        <input type="tel" id="clienteTelefono" placeholder="7000-0000" required>
      </div>
      <div class="form-group">
        <label><i class="fas fa-envelope" style="color:var(--secondary);margin-right:6px;"></i> Correo electrónico</label>
        <input type="email" id="clienteEmail" placeholder="cliente@correo.com">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label><i class="fas fa-calendar-alt" style="color:var(--secondary);margin-right:6px;"></i> Fecha *</label>
          <input type="date" id="reservaFecha" required>
        </div>
        <div class="form-group">
          <label><i class="fas fa-clock" style="color:var(--secondary);margin-right:6px;"></i> Hora *</label>
          <input type="time" id="reservaHora" required>
        </div>
      </div>
      <div class="form-group">
        <label><i class="fas fa-box" style="color:var(--secondary);margin-right:6px;"></i> Paquete *</label>
        <select id="reservaPaquete" required>
          <option value="Básico">Básico</option>
          <option value="Amigos / Dúo">Amigos / Dúo</option>
          <option value="Premium Plus">Premium Plus</option>
          <option value="Estrella Heliot (Promo)">Estrella Heliot (Promo)</option>
        </select>
      </div>
      <div class="form-group">
        <label><i class="fas fa-tag" style="color:var(--secondary);margin-right:6px;"></i> Estado</label>
        <select id="reservaEstado">
          <option value="Pendiente">Pendiente</option>
          <option value="Confirmada">Confirmada</option>
          <option value="Cancelada">Cancelada</option>
        </select>
      </div>
      <div class="form-group">
        <label><i class="fas fa-comment" style="color:var(--secondary);margin-right:6px;"></i> Comentarios</label>
        <textarea id="reservaComentarios" rows="2" placeholder="Observaciones..."></textarea>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-cancel-premium" id="modalCancelBtn">Cancelar</button>
        <button type="submit" class="btn-submit-premium" id="modalSubmitBtn">
          <i class="fas fa-save"></i> Guardar reserva
        </button>
      </div>
    </form>
  </div>
</div>

<script>
  // ============================================
  // CONFIGURACIÓN DE FIREBASE
  // ============================================
  const firebaseConfig = {
    apiKey: "AIzaSyDpRltXZjEBjlq-4vKDlzL5Fgc5NcKr0_8",
    authDomain: "heliotmediaadmin.firebaseapp.com",
    projectId: "heliotmediaadmin",
    storageBucket: "heliotmediaadmin.firebasestorage.app",
    messagingSenderId: "137792880519",
    appId: "1:137792880519:web:8bf42511db838241eddd22"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  // ============================================
  // ELEMENTOS DOM
  // ============================================
  const tbody = document.getElementById('reservasBody');
  const totalReservas = document.getElementById('totalReservas');
  const reservasHoy = document.getElementById('reservasHoy');
  const reservasPendientes = document.getElementById('reservasPendientes');
  const reservasConfirmadas = document.getElementById('reservasConfirmadas');
  const reservasCount = document.getElementById('reservasCount');

  const modal = document.getElementById('modalReserva');
  const modalTitle = document.getElementById('modalTitle');
  const modalCloseBtn = document.getElementById('modalCloseBtn');
  const modalCancelBtn = document.getElementById('modalCancelBtn');
  const modalSubmitBtn = document.getElementById('modalSubmitBtn');
  const reservaForm = document.getElementById('reservaForm');
  const reservaId = document.getElementById('reservaId');
  const clienteNombre = document.getElementById('clienteNombre');
  const clienteTelefono = document.getElementById('clienteTelefono');
  const clienteEmail = document.getElementById('clienteEmail');
  const reservaFecha = document.getElementById('reservaFecha');
  const reservaHora = document.getElementById('reservaHora');
  const reservaPaquete = document.getElementById('reservaPaquete');
  const reservaEstado = document.getElementById('reservaEstado');
  const reservaComentarios = document.getElementById('reservaComentarios');

  let editandoId = null;
  let unsubscribe = null;

  // ============================================
  // AUTENTICACIÓN
  // ============================================
  auth.onAuthStateChanged((user) => {
    if (!user) { window.location.href = 'login-empleados.html'; return; }
    db.collection('users').doc(user.uid).get()
      .then((doc) => {
        const name = doc.exists ? doc.data().name : user.email.split('@')[0];
        document.getElementById('userName').textContent = name;
        document.getElementById('userAvatar').textContent = name.charAt(0).toUpperCase();
      })
      .catch(() => {
        const name = user.email.split('@')[0];
        document.getElementById('userName').textContent = name;
        document.getElementById('userAvatar').textContent = name.charAt(0).toUpperCase();
      });
  });

  document.getElementById('logoutBtn').addEventListener('click', () => {
    auth.signOut().then(() => window.location.href = 'login-empleados.html');
  });

  // ============================================
  // FUNCIÓN: ESCUCHAR RESERVAS (EN TIEMPO REAL)
  // ============================================
  function iniciarEscuchaReservas() {
    if (unsubscribe) unsubscribe();
    unsubscribe = db.collection('reservas')
      .onSnapshot((snapshot) => {
        const reservas = [];
        snapshot.forEach((doc) => {
          reservas.push({ id: doc.id, ...doc.data() });
        });
        // Ordenar manualmente por fecha y hora (descendente)
        reservas.sort((a, b) => {
          if (a.fecha !== b.fecha) return b.fecha.localeCompare(a.fecha);
          return b.hora.localeCompare(a.hora);
        });
        renderizarTabla(reservas);
        actualizarEstadisticas(reservas);
      }, (error) => {
        console.error('Error:', error);
        tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;color:#b91c1c;padding:30px;">
          <i class="fas fa-exclamation-triangle"></i> Error al cargar reservas: ${error.message}
        </td></tr>`;
      });
  }

  function renderizarTabla(reservas) {
    if (!reservas || reservas.length === 0) {
      tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;color:var(--text-muted);padding:40px 0;">
        <i class="fas fa-inbox" style="font-size:28px;display:block;margin-bottom:10px;opacity:0.3;"></i>
        No hay reservas registradas
      </td></tr>`;
      reservasCount.textContent = '0 registros';
      return;
    }
    let html = '';
    reservas.forEach((r) => {
      const estadoClass = r.estado === 'Pendiente' ? 'pendiente' :
                          r.estado === 'Confirmada' ? 'confirmada' : 'cancelada';
      html += `
        <tr>
          <td class="cliente-cell">${r.cliente}${r.email ? `<small>${r.email}</small>` : ''}</td>
          <td>${r.telefono}</td>
          <td>${r.fecha}</td>
          <td>${r.hora}</td>
          <td>${r.paquete}</td>
          <td><span class="badge-status-premium ${estadoClass}">${r.estado}</span></td>
          <td>
            <div class="actions-cell-premium">
              <button class="btn-icon-edit" onclick="editarReserva('${r.id}')"><i class="fas fa-pen"></i> Editar</button>
              <button class="btn-icon-delete" onclick="eliminarReserva('${r.id}')"><i class="fas fa-trash-alt"></i></button>
            </div>
          </td>
        </tr>
      `;
    });
    tbody.innerHTML = html;
    reservasCount.textContent = reservas.length + ' registros';
  }

  function actualizarEstadisticas(reservas) {
    const total = reservas.length;
    const hoy = new Date().toISOString().slice(0,10);
    const hoyCount = reservas.filter(r => r.fecha === hoy).length;
    const pendientes = reservas.filter(r => r.estado === 'Pendiente').length;
    const confirmadas = reservas.filter(r => r.estado === 'Confirmada').length;
    totalReservas.textContent = total;
    reservasHoy.textContent = hoyCount;
    reservasPendientes.textContent = pendientes;
    reservasConfirmadas.textContent = confirmadas;
  }

  // ============================================
  // CRUD
  // ============================================
  document.getElementById('btnNuevaReserva').addEventListener('click', () => {
    editandoId = null;
    modalTitle.textContent = 'Nueva Reserva';
    modalSubmitBtn.innerHTML = '<i class="fas fa-save"></i> Guardar reserva';
    reservaForm.reset();
    reservaId.value = '';
    reservaFecha.value = new Date().toISOString().slice(0,10);
    reservaEstado.value = 'Pendiente';
    modal.classList.add('active');
  });

  window.editarReserva = function(id) {
    db.collection('reservas').doc(id).get()
      .then((doc) => {
        if (!doc.exists) return;
        const r = doc.data();
        editandoId = id;
        modalTitle.textContent = 'Editar Reserva';
        modalSubmitBtn.innerHTML = '<i class="fas fa-save"></i> Actualizar reserva';
        reservaId.value = id;
        clienteNombre.value = r.cliente || '';
        clienteTelefono.value = r.telefono || '';
        clienteEmail.value = r.email || '';
        reservaFecha.value = r.fecha || '';
        reservaHora.value = r.hora || '';
        reservaPaquete.value = r.paquete || 'Básico';
        reservaEstado.value = r.estado || 'Pendiente';
        reservaComentarios.value = r.comentarios || '';
        modal.classList.add('active');
      })
      .catch((err) => alert('Error al cargar: ' + err.message));
  };

  window.eliminarReserva = function(id) {
    if (!confirm('¿Eliminar esta reserva permanentemente?')) return;
    db.collection('reservas').doc(id).delete()
      .catch((err) => alert('Error al eliminar: ' + err.message));
  };

  reservaForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const cliente = clienteNombre.value.trim();
    const telefono = clienteTelefono.value.trim();
    const email = clienteEmail.value.trim();
    const fecha = reservaFecha.value;
    const hora = reservaHora.value;
    const paquete = reservaPaquete.value;
    const estado = reservaEstado.value;
    const comentarios = reservaComentarios.value.trim();

    if (!cliente || !telefono || !fecha || !hora) {
      alert('Completa todos los campos obligatorios.');
      return;
    }

    const data = { cliente, telefono, email, fecha, hora, paquete, estado, comentarios };

    if (editandoId) {
      db.collection('reservas').doc(editandoId).update(data)
        .then(() => cerrarModal())
        .catch((err) => alert('Error al actualizar: ' + err.message));
    } else {
      db.collection('reservas').add({
        ...data,
        creado: firebase.firestore.FieldValue.serverTimestamp()
      })
      .then(() => cerrarModal())
      .catch((err) => alert('Error al crear: ' + err.message));
    }
  });

  function cerrarModal() {
    modal.classList.remove('active');
  }
  modalCloseBtn.addEventListener('click', cerrarModal);
  modalCancelBtn.addEventListener('click', cerrarModal);
  modal.addEventListener('click', (e) => { if (e.target === modal) cerrarModal(); });

  document.getElementById('btnLimpiarFiltros').addEventListener('click', () => {
    if (unsubscribe) { unsubscribe(); iniciarEscuchaReservas(); }
  });

  // ============================================
  // INICIAR
  // ============================================
  auth.onAuthStateChanged((user) => {
    if (user) iniciarEscuchaReservas();
  });
</script>
</body>
</html>
