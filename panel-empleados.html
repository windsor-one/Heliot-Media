<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión · Heliot Media</title>
  <!-- Inter (igual que Zoho Books) -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <style>
    /* ============================================================
       RESET Y BASE (igual que Zoho Books)
       ============================================================ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #f0f2f5;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    /* ============================================================
       TARJETA PRINCIPAL (igual que Zoho Books)
       ============================================================ */
    .login-card {
      max-width: 400px;
      width: 100%;
      background: #ffffff;
      border-radius: 16px;
      padding: 40px 32px 32px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.06);
      border: 1px solid #e6e9ef;
      transition: border 0.2s;
    }

    /* Logo */
    .login-card .logo {
      text-align: center;
      margin-bottom: 28px;
    }
    .login-card .logo img {
      height: 44px;
      width: auto;
    }

    /* Título y subtítulo */
    .login-card h1 {
      font-size: 22px;
      font-weight: 600;
      color: #1a2634;
      text-align: center;
      margin-bottom: 4px;
    }
    .login-card .sub {
      text-align: center;
      color: #5f6b7a;
      font-size: 14px;
      margin-bottom: 28px;
    }

    /* Mensajes de error / éxito */
    .login-card .msg {
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }
    .login-card .msg.error {
      background: #fee9e7;
      color: #b91c1c;
    }
    .login-card .msg.success {
      background: #e6f7e6;
      color: #0b6e0b;
    }

    /* Campos de formulario */
    .login-card .form-group {
      margin-bottom: 18px;
    }
    .login-card .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #1a2634;
      margin-bottom: 4px;
    }
    .login-card .form-group input {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      transition: 0.2s;
      background: #fafbfc;
      color: #1a2634;
    }
    .login-card .form-group input:focus {
      border-color: #066CFF;
      outline: none;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(6, 108, 255, 0.1);
    }

    /* Botón primario (azul) */
    .login-card .btn-primary {
      width: 100%;
      padding: 12px;
      background: #066CFF;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      font-family: 'Inter', sans-serif;
      margin-top: 4px;
    }
    .login-card .btn-primary:hover {
      background: #0052cc;
    }
    .login-card .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Enlace de ayuda */
    .login-card .help-links {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 16px;
      font-size: 13px;
    }
    .login-card .help-links a {
      color: #066CFF;
      text-decoration: none;
      font-weight: 500;
      transition: 0.15s;
    }
    .login-card .help-links a:hover {
      text-decoration: underline;
    }
    .login-card .help-links .forgot {
      color: #5f6b7a;
    }

    /* Separador "o" */
    .login-card .separator {
      display: flex;
      align-items: center;
      gap: 15px;
      margin: 24px 0 20px;
      color: #8a94a6;
      font-size: 12px;
    }
    .login-card .separator::before,
    .login-card .separator::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #e6e9ef;
    }

    /* Registro (oculto por defecto) */
    .login-card .register-fields {
      display: none;
    }
    .login-card .register-fields.active {
      display: block;
    }

    /* Ayuda para el código de empleado */
    .login-card .code-hint {
      font-size: 12px;
      color: #8a94a6;
      margin-top: 4px;
    }

    /* ============================================================
       FOOTER (igual que Zoho Books)
       ============================================================ */
    .login-footer {
      margin-top: 32px;
      text-align: center;
      font-size: 12px;
      color: #8a94a6;
      max-width: 400px;
      width: 100%;
    }
    .login-footer a {
      color: #066CFF;
      text-decoration: none;
      font-weight: 500;
    }
    .login-footer a:hover {
      text-decoration: underline;
    }
    .login-footer .legal {
      margin-top: 4px;
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .login-footer .legal a {
      color: #8a94a6;
      font-weight: 400;
    }

    /* ============================================================
       RESPONSIVE
       ============================================================ */
    @media (max-width: 480px) {
      .login-card {
        padding: 30px 20px 24px;
      }
      .login-card h1 {
        font-size: 20px;
      }
      .login-card .help-links {
        flex-direction: column;
        gap: 8px;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>

  <!-- ===== TARJETA DE LOGIN ===== -->
  <div class="login-card">

    <!-- Logo -->
    <div class="logo">
      <img
        src="https://blogger.googleusercontent.com/img/a/AVvXsEgjN90ubujO6aF76PMuNTY7el1YR7BDF-CsXglaMEAB_FSzryOks4Zflmnn0fZlXBulUQtp64A5ZJt8IalatFXCNNV2K-qI09uqllYLvcsA_maBOKJ8pggVjMz4OMdG8HZTr2Lyj0dJlThvA37O3PN1IF9BYtaQigzIOVnh9Jovq5FY26YVU_uwK0p0nMuw"
        alt="Heliot Media"
      />
    </div>

    <!-- Título -->
    <h1>Área de Empleados</h1>
    <p class="sub" id="formSub">Accede para gestionar reservas</p>

    <!-- Mensajes -->
    <div id="errorMsg" class="msg error"></div>
    <div id="successMsg" class="msg success"></div>

    <!-- ===== FORMULARIO DE LOGIN ===== -->
    <form id="loginForm">
      <div class="form-group">
        <label>Correo electrónico</label>
        <input type="email" id="loginEmail" placeholder="empleado@heliot.com" required />
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" id="loginPassword" placeholder="••••••••" required />
      </div>
      <button type="submit" class="btn-primary">Iniciar sesión</button>

      <div class="help-links">
        <span class="forgot">¿Olvidó su contraseña?</span>
        <a href="#" id="toggleBtn">Registrarse</a>
      </div>
    </form>

    <!-- ===== FORMULARIO DE REGISTRO (toggle) ===== -->
    <div class="register-fields" id="registerContainer">
      <div class="separator">o</div>

      <form id="registerForm">
        <div class="form-group">
          <label>Correo electrónico</label>
          <input type="email" id="registerEmail" placeholder="empleado@heliot.com" required />
        </div>
        <div class="form-group">
          <label>Nombre completo</label>
          <input type="text" id="registerName" placeholder="Tu nombre" required />
        </div>
        <div class="form-group">
          <label>Contraseña (mínimo 6 caracteres)</label>
          <input type="password" id="registerPassword" placeholder="••••••••" required minlength="6" />
        </div>
        <div class="form-group">
          <label>Código de empleado</label>
          <input type="text" id="registerCode" placeholder="Código secreto" required />
          <div class="code-hint">Pide el código a tu supervisor.</div>
        </div>
        <button type="submit" class="btn-primary">Registrarse</button>

        <div class="help-links" style="margin-top:12px; justify-content:center;">
          <a href="#" id="toggleBack">← Volver a iniciar sesión</a>
        </div>
      </form>
    </div>

  </div>

  <!-- ===== FOOTER ===== -->
  <div class="login-footer">
    <p>&copy; 2026 Heliot Media · Todos los derechos reservados.</p>
    <div class="legal">
      <a href="terminos-y-condiciones-de-uso.html">Términos</a>
      <a href="politica-de-privacidad.html">Privacidad</a>
      <a href="politica-de-cookies.html">Cookies</a>
    </div>
  </div>

  <!-- ============================================================
  JAVASCRIPT (FIREBASE)
  ============================================================ -->
  <script>
    // ============================================
    // 1. CONFIGURACIÓN DE FIREBASE
    // ============================================
    const firebaseConfig = {
      apiKey: "AIzaSyDpRltXZjEBjlq-4vKDlzL5Fgc5NcKr0_8",
      authDomain: "heliotmediaadmin.firebaseapp.com",
      projectId: "heliotmediaadmin",
      storageBucket: "heliotmediaadmin.firebasestorage.app",
      messagingSenderId: "137792880519",
      appId: "1:137792880519:web:8bf42511db838241eddd22"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const EMPLOYEE_CODE = 'HELIOT2026';

    // ============================================
    // 2. ELEMENTOS DOM
    // ============================================
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    const registerContainer = document.getElementById('registerContainer');
    const toggleBtn = document.getElementById('toggleBtn');
    const toggleBack = document.getElementById('toggleBack');
    const errorMsg = document.getElementById('errorMsg');
    const successMsg = document.getElementById('successMsg');
    const formSub = document.getElementById('formSub');

    let isLogin = true;

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.className = 'msg error';
      errorMsg.style.display = 'block';
      successMsg.style.display = 'none';
    }

    function showSuccess(msg) {
      successMsg.textContent = msg;
      successMsg.className = 'msg success';
      successMsg.style.display = 'block';
      errorMsg.style.display = 'none';
    }

    function hideMessages() {
      errorMsg.style.display = 'none';
      successMsg.style.display = 'none';
    }

    // ============================================
    // 3. TOGGLE LOGIN / REGISTRO
    // ============================================
    function toggleMode(showLogin) {
      isLogin = showLogin;
      if (isLogin) {
        loginForm.style.display = 'block';
        registerContainer.classList.remove('active');
        toggleBtn.textContent = 'Registrarse';
        formSub.textContent = 'Accede para gestionar reservas';
      } else {
        loginForm.style.display = 'none';
        registerContainer.classList.add('active');
        toggleBtn.textContent = 'Iniciar sesión';
        formSub.textContent = 'Crea tu cuenta de empleado';
      }
      hideMessages();
    }

    toggleBtn.addEventListener('click', (e) => {
      e.preventDefault();
      toggleMode(!isLogin);
    });

    toggleBack.addEventListener('click', (e) => {
      e.preventDefault();
      toggleMode(true);
    });

    // ============================================
    // 4. LOGIN
    // ============================================
    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      if (!email || !password) {
        showError('Completa todos los campos.');
        return;
      }
      const btn = loginForm.querySelector('.btn-primary');
      btn.disabled = true;
      btn.textContent = 'Iniciando...';
      auth.signInWithEmailAndPassword(email, password)
        .then(() => {
          window.location.href = 'panel-empleados.html';
        })
        .catch((err) => {
          let msg = 'Error al iniciar sesión. Verifica tus credenciales.';
          if (err.code === 'auth/user-not-found') msg = 'Usuario no encontrado.';
          if (err.code === 'auth/wrong-password') msg = 'Contraseña incorrecta.';
          if (err.code === 'auth/invalid-email') msg = 'Correo inválido.';
          if (err.code === 'auth/too-many-requests') msg = 'Demasiados intentos. Espera un momento.';
          showError(msg);
          btn.disabled = false;
          btn.textContent = 'Iniciar sesión';
        });
    });

    // ============================================
    // 5. REGISTRO
    // ============================================
    registerForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('registerEmail').value.trim();
      const name = document.getElementById('registerName').value.trim();
      const password = document.getElementById('registerPassword').value;
      const code = document.getElementById('registerCode').value.trim();

      if (!email || !name || !password || !code) {
        showError('Completa todos los campos.');
        return;
      }
      if (code !== EMPLOYEE_CODE) {
        showError('Código de empleado incorrecto.');
        return;
      }
      if (password.length < 6) {
        showError('La contraseña debe tener al menos 6 caracteres.');
        return;
      }

      const btn = registerForm.querySelector('.btn-primary');
      btn.disabled = true;
      btn.textContent = 'Registrando...';

      auth.createUserWithEmailAndPassword(email, password)
        .then((userCredential) => {
          const user = userCredential.user;
          return db.collection('users').doc(user.uid).set({
            email: email,
            name: name,
            rol: 'Recepcionista',
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
        })
        .then(() => {
          showSuccess('¡Cuenta creada! Ahora inicia sesión.');
          // Autocompletar el login
          document.getElementById('loginEmail').value = email;
          document.getElementById('loginPassword').value = password;
          setTimeout(() => {
            toggleMode(true);
            btn.disabled = false;
            btn.textContent = 'Registrarse';
          }, 1500);
        })
        .catch((err) => {
          let msg = 'Error al registrar.';
          if (err.code === 'auth/email-already-in-use') msg = 'Este correo ya está registrado.';
          if (err.code === 'auth/invalid-email') msg = 'Correo inválido.';
          if (err.code === 'auth/weak-password') msg = 'Contraseña demasiado débil.';
          showError(msg);
          btn.disabled = false;
          btn.textContent = 'Registrarse';
        });
    });

    // ============================================
    // 6. REDIRIGIR SI YA HAY SESIÓN
    // ============================================
    auth.onAuthStateChanged((user) => {
      if (user) {
        window.location.href = 'panel-empleados.html';
      }
    });
  </script>

</body>
</html>
