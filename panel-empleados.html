<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel de Empleados · Heliot Media</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <style>
    /* ===== RESET & BASE ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #f0f2f5;
      color: #1a2634;
      height: 100vh;
      display: flex;
    }

    /* ===== SIDEBAR ===== */
    .sidebar {
      width: 240px;
      background: #fff;
      border-right: 1px solid #e6e9ef;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      height: 100vh;
      position: sticky;
      top: 0;
      overflow-y: auto;
    }
    .sidebar .logo-area {
      padding: 20px 20px 16px;
      border-bottom: 1px solid #e6e9ef;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .sidebar .logo-area img {
      height: 32px;
      width: auto;
    }
    .sidebar .logo-area span {
      font-weight: 600;
      font-size: 16px;
      color: #1a2634;
    }
    .sidebar nav {
      flex: 1;
      padding: 16px 12px;
    }
    .sidebar nav .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-radius: 8px;
      color: #5f6b7a;
      font-weight: 500;
      font-size: 14px;
      cursor: default;
      transition: 0.15s;
      margin-bottom: 2px;
    }
    .sidebar nav .nav-item.active {
      background: #eef4ff;
      color: #066CFF;
    }
    .sidebar nav .nav-item .icon {
      font-size: 18px;
      width: 24px;
      text-align: center;
    }
    .sidebar .user-section {
      padding: 16px 20px;
      border-top: 1px solid #e6e9ef;
      font-size: 13px;
      color: #5f6b7a;
    }
    .sidebar .user-section .user-name {
      font-weight: 600;
      color: #1a2634;
      margin-bottom: 4px;
    }
    .sidebar .user-section .logout-btn {
      background: none;
      border: none;
      color: #066CFF;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }
    .sidebar .user-section .logout-btn:hover {
      text-decoration: underline;
    }

    /* ===== MAIN CONTENT ===== */
    .main-content {
      flex: 1;
      padding: 28px 32px;
      overflow-y: auto;
      height: 100vh;
    }
    .main-content .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .main-content .page-header h1 {
      font-size: 22px;
      font-weight: 600;
      color: #1a2634;
    }

    /* ===== STATS ===== */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }
    .stat-card {
      background: #fff;
      padding: 18px 16px;
      border-radius: 12px;
      border: 1px solid #e6e9ef;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    }
    .stat-card .number {
      font-size: 28px;
      font-weight: 700;
      color: #1a2634;
    }
    .stat-card .label {
      font-size: 13px;
      color: #5f6b7a;
      margin-top: 4px;
    }

    /* ===== ACTIONS ===== */
    .actions-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 24px;
    }
    .btn {
      font-family: 'Inter', sans-serif;
      padding: 8px 20px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      border: none;
      cursor: pointer;
      transition: 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-primary {
      background: #066CFF;
      color: #fff;
    }
    .btn-primary:hover {
      background: #0052cc;
    }
    .btn-secondary {
      background: #e6e9ef;
      color: #1a2634;
    }
    .btn-secondary:hover {
      background: #d1d5db;
    }
    .btn-danger {
      background: #dc3545;
      color: #fff;
    }
    .btn-danger:hover {
      background: #b02a37;
    }
    .btn-edit {
      background: #28a745;
      color: #fff;
    }
    .btn-edit:hover {
      background: #1e7e34;
    }

    /* ===== TABLE ===== */
    .table-wrapper {
      background: #fff;
      border-radius: 12px;
      border: 1px solid #e6e9ef;
      overflow-x: auto;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      min-width: 600px;
    }
    thead {
      background: #f8f9fc;
    }
    th {
      text-align: left;
      padding: 14px 16px;
      font-weight: 600;
      color: #1a2634;
      border-bottom: 1px solid #e6e9ef;
    }
    td {
      padding: 12px 16px;
      border-bottom: 1px solid #e6e9ef;
      vertical-align: middle;
    }
    tr:last-child td { border-bottom: none; }
    .badge-status {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
    .badge-pendiente { background: #fff3cd; color: #856404; }
    .badge-confirmada { background: #d4edda; color: #155724; }
    .badge-cancelada { background: #f8d7da; color: #721c24; }
    .actions-cell {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    /* ===== MODAL ===== */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 20px;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: #fff;
      max-width: 540px;
      width: 100%;
      border-radius: 16px;
      padding: 28px 32px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
      animation: slideUp 0.25s ease;
    }
    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .modal h2 {
      font-size: 20px;
      font-weight: 600;
      color: #1a2634;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-close {
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: #8a94a6;
      transition: 0.15s;
    }
    .modal-close:hover { color: #1a2634; }
    .modal .form-group {
      margin-bottom: 16px;
    }
    .modal .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #1a2634;
      margin-bottom: 4px;
    }
    .modal .form-group input,
    .modal .form-group select,
    .modal .form-group textarea {
      width: 100%;
      padding: 8px 12px;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      background: #fafbfc;
      transition: 0.15s;
    }
    .modal .form-group input:focus,
    .modal .form-group select:focus,
    .modal .form-group textarea:focus {
      border-color: #066CFF;
      outline: none;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(6,108,255,0.08);
    }
    .modal .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    .modal .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 20px;
    }
    .modal .btn-cancel {
      background: #e6e9ef;
      color: #1a2634;
      border: none;
      padding: 8px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
    }
    .modal .btn-cancel:hover { background: #d1d5db; }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 768px) {
      .sidebar { width: 60px; }
      .sidebar .logo-area span { display: none; }
      .sidebar .logo-area { justify-content: center; padding: 16px 0; }
      .sidebar .user-section .user-name { display: none; }
      .sidebar .user-section .logout-btn { font-size: 12px; }
      .sidebar nav .nav-item span { display: none; }
      .sidebar nav .nav-item { justify-content: center; padding: 10px; }
      .main-content { padding: 20px 16px; }
      .stats-grid { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 480px) {
      .stats-grid { grid-template-columns: 1fr; }
      .modal .form-row { grid-template-columns: 1fr; }
      .main-content .page-header h1 { font-size: 18px; }
    }
  </style>
</head>
<body>

  <!-- ===== SIDEBAR ===== -->
  <div class="sidebar">
    <div class="logo-area">
      <img src="https://blogger.googleusercontent.com/img/a/AVvXsEgjN90ubujO6aF76PMuNTY7el1YR7BDF-CsXglaMEAB_FSzryOks4Zflmnn0fZlXBulUQtp64A5ZJt8IalatFXCNNV2K-qI09uqllYLvcsA_maBOKJ8pggVjMz4OMdG8HZTr2Lyj0dJlThvA37O3PN1IF9BYtaQigzIOVnh9Jovq5FY26YVU_uwK0p0nMuw" alt="Heliot">
      <span>Heliot Media</span>
    </div>
    <nav>
      <div class="nav-item active">
        <span class="icon">📋</span>
        <span>Reservas</span>
      </div>
      <!-- Puedes agregar más items si quieres -->
    </nav>
    <div class="user-section">
      <div class="user-name" id="userName">Empleado</div>
      <button class="logout-btn" id="logoutBtn">Cerrar sesión</button>
    </div>
  </div>

  <!-- ===== MAIN CONTENT ===== -->
  <div class="main-content">

    <div class="page-header">
      <h1>Reservas</h1>
      <div style="display:flex; gap:8px; align-items:center;">
        <span style="font-size:14px; color:#5f6b7a;" id="userNameHeader">Empleado</span>
      </div>
    </div>

    <!-- Stats -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="number" id="totalReservas">0</div>
        <div class="label">Total reservas</div>
      </div>
      <div class="stat-card">
        <div class="number" id="reservasHoy">0</div>
        <div class="label">Reservas de hoy</div>
      </div>
      <div class="stat-card">
        <div class="number" id="reservasPendientes">0</div>
        <div class="label">Pendientes</div>
      </div>
    </div>

    <!-- Actions -->
    <div class="actions-bar">
      <button class="btn btn-primary" id="btnNuevaReserva">➕ Nueva reserva</button>
      <button class="btn btn-secondary" id="btnLimpiarFiltros">🔄 Mostrar todas</button>
    </div>

    <!-- Table -->
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Cliente</th>
            <th>Teléfono</th>
            <th>Fecha</th>
            <th>Hora</th>
            <th>Paquete</th>
            <th>Estado</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="reservasBody">
          <tr><td colspan="7" style="text-align:center; color:#8a94a6; padding:30px;">Cargando reservas...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- ===== MODAL ===== -->
  <div class="modal-overlay" id="modalReserva">
    <div class="modal">
      <h2>
        <span id="modalTitle">Nueva Reserva</span>
        <button class="modal-close" id="modalCloseBtn">&times;</button>
      </h2>
      <form id="reservaForm">
        <input type="hidden" id="reservaId" value="">
        <div class="form-group">
          <label>Nombre del cliente *</label>
          <input type="text" id="clienteNombre" placeholder="Ej: María González" required>
        </div>
        <div class="form-group">
          <label>Teléfono *</label>
          <input type="tel" id="clienteTelefono" placeholder="7000-0000" required>
        </div>
        <div class="form-group">
          <label>Correo electrónico</label>
          <input type="email" id="clienteEmail" placeholder="cliente@correo.com">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Fecha *</label>
            <input type="date" id="reservaFecha" required>
          </div>
          <div class="form-group">
            <label>Hora *</label>
            <input type="time" id="reservaHora" required>
          </div>
        </div>
        <div class="form-group">
          <label>Paquete *</label>
          <select id="reservaPaquete" required>
            <option value="Básico">Básico</option>
            <option value="Amigos / Dúo">Amigos / Dúo</option>
            <option value="Premium Plus">Premium Plus</option>
            <option value="Estrella Heliot (Promo)">Estrella Heliot (Promo)</option>
          </select>
        </div>
        <div class="form-group">
          <label>Estado</label>
          <select id="reservaEstado">
            <option value="Pendiente">Pendiente</option>
            <option value="Confirmada">Confirmada</option>
            <option value="Cancelada">Cancelada</option>
          </select>
        </div>
        <div class="form-group">
          <label>Comentarios adicionales</label>
          <textarea id="reservaComentarios" rows="2" placeholder="Observaciones..."></textarea>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-cancel" id="modalCancelBtn">Cancelar</button>
          <button type="submit" class="btn btn-primary" id="modalSubmitBtn">Guardar reserva</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // ============================================
    // 1. CONFIGURACIÓN DE FIREBASE
    // ============================================
    const firebaseConfig = {
      apiKey: "AIzaSyDpRltXZjEBjlq-4vKDlzL5Fgc5NcKr0_8",
      authDomain: "heliotmediaadmin.firebaseapp.com",
      projectId: "heliotmediaadmin",
      storageBucket: "heliotmediaadmin.firebasestorage.app",
      messagingSenderId: "137792880519",
      appId: "1:137792880519:web:8bf42511db838241eddd22"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // ============================================
    // 2. VERIFICAR SESIÓN Y CARGAR NOMBRE
    // ============================================
    let userName = 'Empleado';
    auth.onAuthStateChanged((user) => {
      if (!user) {
        window.location.href = 'login-empleados.html';
        return;
      }
      db.collection('users').doc(user.uid).get()
        .then((doc) => {
          if (doc.exists) {
            userName = doc.data().name || 'Empleado';
          } else {
            userName = user.email.split('@')[0] || 'Empleado';
          }
          document.getElementById('userName').textContent = userName;
          document.getElementById('userNameHeader').textContent = userName;
        })
        .catch(() => {
          userName = user.email.split('@')[0] || 'Empleado';
          document.getElementById('userName').textContent = userName;
          document.getElementById('userNameHeader').textContent = userName;
        });
    });

    // ============================================
    // 3. CERRAR SESIÓN
    // ============================================
    document.getElementById('logoutBtn').addEventListener('click', () => {
      auth.signOut().then(() => { window.location.href = 'login-empleados.html'; });
    });

    // ============================================
    // 4. REFERENCIAS DOM
    // ============================================
    const tbody = document.getElementById('reservasBody');
    const totalReservas = document.getElementById('totalReservas');
    const reservasHoy = document.getElementById('reservasHoy');
    const reservasPendientes = document.getElementById('reservasPendientes');

    const modal = document.getElementById('modalReserva');
    const modalTitle = document.getElementById('modalTitle');
    const modalCloseBtn = document.getElementById('modalCloseBtn');
    const modalCancelBtn = document.getElementById('modalCancelBtn');
    const modalSubmitBtn = document.getElementById('modalSubmitBtn');
    const reservaForm = document.getElementById('reservaForm');
    const reservaId = document.getElementById('reservaId');
    const clienteNombre = document.getElementById('clienteNombre');
    const clienteTelefono = document.getElementById('clienteTelefono');
    const clienteEmail = document.getElementById('clienteEmail');
    const reservaFecha = document.getElementById('reservaFecha');
    const reservaHora = document.getElementById('reservaHora');
    const reservaPaquete = document.getElementById('reservaPaquete');
    const reservaEstado = document.getElementById('reservaEstado');
    const reservaComentarios = document.getElementById('reservaComentarios');

    let editandoId = null;
    let unsubscribe = null;

    // ============================================
    // 5. ESCUCHA EN TIEMPO REAL (sin orderBy para evitar índices)
    // ============================================
    function iniciarEscuchaReservas() {
      if (unsubscribe) unsubscribe();
      unsubscribe = db.collection('reservas')
        .onSnapshot((snapshot) => {
          const reservas = [];
          snapshot.forEach((doc) => {
            reservas.push({ id: doc.id, ...doc.data() });
          });
          // Ordenar manualmente por fecha y hora descendente
          reservas.sort((a, b) => {
            if (a.fecha !== b.fecha) return b.fecha.localeCompare(a.fecha);
            return b.hora.localeCompare(a.hora);
          });
          renderizarTabla(reservas);
          actualizarEstadisticas(reservas);
        }, (error) => {
          console.error('Error al escuchar reservas:', error);
          tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; color:#b91c1c; padding:30px;">Error al cargar reservas. Verifica tu conexión.</td></tr>';
        });
    }

    function renderizarTabla(reservas) {
      if (!reservas || reservas.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; color:#8a94a6; padding:30px;">No hay reservas registradas</td></tr>';
        return;
      }
      let html = '';
      reservas.forEach((r) => {
        const estadoClass = r.estado === 'Pendiente' ? 'badge-pendiente' :
                            r.estado === 'Confirmada' ? 'badge-confirmada' : 'badge-cancelada';
        html += `
          <tr>
            <td><strong>${r.cliente}</strong>${r.email ? `<br><small style="color:#8a94a6;">${r.email}</small>` : ''}</td>
            <td>${r.telefono}</td>
            <td>${r.fecha}</td>
            <td>${r.hora}</td>
            <td>${r.paquete}</td>
            <td><span class="badge-status ${estadoClass}">${r.estado}</span></td>
            <td>
              <div class="actions-cell">
                <button class="btn btn-edit" onclick="editarReserva('${r.id}')" style="padding:4px 12px; font-size:12px;">✎ Editar</button>
                <button class="btn btn-danger" onclick="eliminarReserva('${r.id}')" style="padding:4px 12px; font-size:12px;">✕ Eliminar</button>
              </div>
            </td>
          </tr>
        `;
      });
      tbody.innerHTML = html;
    }

    function actualizarEstadisticas(reservas) {
      const total = reservas.length;
      const hoy = new Date().toISOString().slice(0,10);
      const hoyCount = reservas.filter(r => r.fecha === hoy).length;
      const pendientes = reservas.filter(r => r.estado === 'Pendiente').length;
      totalReservas.textContent = total;
      reservasHoy.textContent = hoyCount;
      reservasPendientes.textContent = pendientes;
    }

    // ============================================
    // 6. CRUD: CREAR, EDITAR, ELIMINAR
    // ============================================
    document.getElementById('btnNuevaReserva').addEventListener('click', () => {
      editandoId = null;
      modalTitle.textContent = 'Nueva Reserva';
      modalSubmitBtn.textContent = 'Guardar reserva';
      reservaForm.reset();
      reservaId.value = '';
      const hoy = new Date().toISOString().slice(0,10);
      reservaFecha.value = hoy;
      reservaEstado.value = 'Pendiente';
      modal.classList.add('active');
    });

    window.editarReserva = function(id) {
      db.collection('reservas').doc(id).get()
        .then((doc) => {
          if (!doc.exists) return;
          const r = doc.data();
          editandoId = id;
          modalTitle.textContent = 'Editar Reserva';
          modalSubmitBtn.textContent = 'Actualizar reserva';
          reservaId.value = id;
          clienteNombre.value = r.cliente || '';
          clienteTelefono.value = r.telefono || '';
          clienteEmail.value = r.email || '';
          reservaFecha.value = r.fecha || '';
          reservaHora.value = r.hora || '';
          reservaPaquete.value = r.paquete || 'Básico';
          reservaEstado.value = r.estado || 'Pendiente';
          reservaComentarios.value = r.comentarios || '';
          modal.classList.add('active');
        })
        .catch((err) => alert('Error al cargar la reserva: ' + err.message));
    };

    window.eliminarReserva = function(id) {
      if (!confirm('¿Eliminar esta reserva permanentemente?')) return;
      db.collection('reservas').doc(id).delete()
        .catch((err) => alert('Error al eliminar: ' + err.message));
    };

    // ============================================
    // 7. GUARDAR RESERVA (CREAR O EDITAR)
    // ============================================
    reservaForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const cliente = clienteNombre.value.trim();
      const telefono = clienteTelefono.value.trim();
      const email = clienteEmail.value.trim();
      const fecha = reservaFecha.value;
      const hora = reservaHora.value;
      const paquete = reservaPaquete.value;
      const estado = reservaEstado.value;
      const comentarios = reservaComentarios.value.trim();

      if (!cliente || !telefono || !fecha || !hora) {
        alert('Completa todos los campos obligatorios.');
        return;
      }

      const data = { cliente, telefono, email, fecha, hora, paquete, estado, comentarios };

      if (editandoId) {
        db.collection('reservas').doc(editandoId).update(data)
          .then(() => cerrarModal())
          .catch((err) => alert('Error al actualizar: ' + err.message));
      } else {
        db.collection('reservas').add({
          ...data,
          creado: firebase.firestore.FieldValue.serverTimestamp()
        })
        .then(() => cerrarModal())
        .catch((err) => alert('Error al crear: ' + err.message));
      }
    });

    // ============================================
    // 8. CERRAR MODAL
    // ============================================
    function cerrarModal() {
      modal.classList.remove('active');
    }
    modalCloseBtn.addEventListener('click', cerrarModal);
    modalCancelBtn.addEventListener('click', cerrarModal);
    modal.addEventListener('click', (e) => {
      if (e.target === modal) cerrarModal();
    });

    // ============================================
    // 9. FILTRO: MOSTRAR TODAS
    // ============================================
    document.getElementById('btnLimpiarFiltros').addEventListener('click', () => {
      if (unsubscribe) {
        unsubscribe();
        iniciarEscuchaReservas();
      }
    });

    // ============================================
    // 10. INICIALIZAR
    // ============================================
    auth.onAuthStateChanged((user) => {
      if (user) {
        iniciarEscuchaReservas();
      }
    });
  </script>
</body>
</html>
